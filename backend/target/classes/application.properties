# ============================================================================
#  application.properties  -  Configuracion de la aplicacion Spring Boot
# ============================================================================

# ----- Puerto del servidor -----
server.port=8080

# ----- Base de datos H2 (en memoria) -----
# H2 es una base de datos que vive en la memoria RAM: no hay que instalar nada.
# Los datos se pierden al apagar la aplicacion (perfecto para pruebas).
spring.datasource.url=jdbc:h2:mem:rutasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ----- Consola web de H2 -----
# Permite ver la base de datos en el navegador: http://localhost:8080/h2-console
# (usar JDBC URL: jdbc:h2:mem:rutasdb , usuario: sa , sin contrasena)
spring.h2.console.enabled=true

# ----- JPA / Hibernate -----
# create-drop: crea las tablas al iniciar y las borra al cerrar la app.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# IMPORTANTE: hace que data.sql se ejecute DESPUES de que JPA cree las tablas,
# para que los datos de prueba se inserten correctamente.
spring.jpa.defer-datasource-initialization=true

# ----- Swagger / OpenAPI -----
# Documentacion interactiva de la API en: http://localhost:8080/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui/index.html
